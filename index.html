    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Poppins", "sans-serif"],
            },
          },
        },
      };

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"

    <style>
      .font-display {
        font-family: "Poppins", sans-serif;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.08);
        }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }
      .animate-float-slow {
        animation: float 12s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .animate-blink {
        animation: blink 1.6s ease-in-out infinite;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .link-item {
        opacity: 0;
      }
      .link-item.show {
        animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .link-btn {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          background-color 0.25s ease,
          border-color 0.25s ease;
      }
      .link-btn:hover {
        transform: translateY(-4px) scale(1.02);
      }
      .link-btn:active {
        transform: translateY(0) scale(0.97);
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .avatar-ring {
        background: linear-gradient(90deg, #3b82f6, #eab308, #ffffff, #3b82f6);
        background-size: 200% 100%;
        animation: shimmer 4s linear infinite;
      }
    </style>
  </head>

      // ============ RENDER LINK ============
      const container = document.getElementById("links");

      LINKS.forEach((link, i) => {
        const a = document.createElement("a");
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        if (link.download) a.download = "E-Book DPM Ma'soem.pdf";
        a.className =
          "link-item link-btn group flex w-full items-center gap-3 rounded-2xl border border-blue-100 bg-white p-3 shadow-md shadow-blue-500/10 sm:gap-4 sm:p-4";

        const iconBox = document.createElement("div");
        iconBox.className =
          "flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br sm:h-12 sm:w-12 " +
          link.color +
          " shadow-lg transition-transform duration-300 group-hover:rotate-6 group-hover:scale-110";
        iconBox.innerHTML =
          '<svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">' +
          ICONS[link.icon] +
          "</svg>";

        const textWrap = document.createElement("div");
        textWrap.className = "flex min-w-0 flex-1 flex-col";

        const label = document.createElement("span");
        label.className = "truncate font-semibold text-slate-900";
        label.textContent = link.label;

        const desc = document.createElement("span");
        desc.className = "truncate text-sm text-slate-500";
        desc.textContent = link.desc;

        textWrap.appendChild(label);
        textWrap.appendChild(desc);

        const arrow = document.createElement("span");
        arrow.className =
          "shrink-0 text-slate-400 transition-transform duration-300 group-hover:translate-x-1 group-hover:text-blue-500";
        arrow.innerHTML =
          '<svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>';

        a.appendChild(textWrap);
        a.appendChild(arrow);

        a.style.transitionDelay = 0.05 * i + "s";
        container.appendChild(a);
      });

      setTimeout(() => {
        document.querySelectorAll(".link-item").forEach((el) => {
          el.classList.add("show");
